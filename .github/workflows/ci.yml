name: API Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options: [ qa, staging ]
      groups:
        description: 'TestNG groups to run (leave blank for all)'
        required: false
        default: ''

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API tests
        run: |
          BASE_URL="${{ vars.BASE_URL }}"
          BASE_URL="${BASE_URL:-https://reqres.in}"
          MVN_ARGS="clean verify"
          if [ -n "${{ github.event.inputs.groups }}" ]; then
            MVN_ARGS="$MVN_ARGS -Dgroups=${{ github.event.inputs.groups }}"
          fi
          mvn $MVN_ARGS \
            -Dbase.url="$BASE_URL" \
            -Denv=${{ github.event.inputs.env || 'qa' }} \
            -Dmaven.test.failure.ignore=true

      - name: Check for test failures
        run: |
          REPORTS=$(find target/surefire-reports -name '*.xml' 2>/dev/null || true)
          if [ -z "$REPORTS" ]; then
            echo "No Surefire reports found — build may have failed before tests ran."
            exit 1
          fi
          if grep -l 'failures="[1-9]\|errors="[1-9]' $REPORTS 2>/dev/null | grep -q .; then
            echo "::error::One or more API tests failed. Check the Allure report in artifacts."
            exit 1
          fi
          echo "All API tests passed."

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: mvn allure:report -q

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn

      - name: Upload failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            test-output/api-failures/
            logs/
          if-no-files-found: warn
