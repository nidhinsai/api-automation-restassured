name: API Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly regression at 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options: [ qa, staging ]
      groups:
        description: 'TestNG groups to run (leave blank for all)'
        required: false
        default: ''

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API tests
        run: |
          MVN_ARGS="clean verify"
          if [ -n "${{ github.event.inputs.groups }}" ]; then
            MVN_ARGS="$MVN_ARGS -Dgroups=${{ github.event.inputs.groups }}"
          fi
          mvn $MVN_ARGS \
            -Dbase.url=${{ vars.BASE_URL || 'https://reqres.in' }} \
            -Denv=${{ github.event.inputs.env || 'qa' }}

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            test-output/api-failures/
            logs/

      - name: Publish Allure to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          destination_dir: allure-report
